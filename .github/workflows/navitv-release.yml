# NaviTV releases: tag a commit and start its desktop build, or publish the
# finished draft so installed apps pick up the update.
name: NaviTV release

on:
    workflow_dispatch:
        inputs:
            action:
                description: 'tag (create the tag and build) or publish (undraft)'
                required: true
                default: tag
                type: choice
                options: [tag, publish, from-run]
            version:
                description: 'Version, e.g. 1.0.0'
                required: true
            run_id:
                description: 'from-run: the finished build run to release'
                required: false

permissions:
    contents: write
    actions: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Tag and build
              if: inputs.action == 'tag'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: v${{ inputs.version }}
              run: |
                  set -euo pipefail
                  gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                    -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" ||
                    gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                      -f sha="$GITHUB_SHA" -F force=true
                  gh workflow run build-and-make.yaml -R "$GITHUB_REPOSITORY" --ref "$TAG"
            - name: Publish draft
              if: inputs.action == 'publish'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: v${{ inputs.version }}
              run: |
                  set -euo pipefail
                  id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
                    --jq "[.[] | select(.tag_name == \"$TAG\" and .draft)][0].id")
                  test -n "$id"
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
                    -F draft=false -F prerelease=false -f make_latest=true --jq .html_url
            - name: Release a finished build
              if: inputs.action == 'from-run'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: v${{ inputs.version }}
                  RUN_ID: ${{ inputs.run_id }}
              run: |
                  set -euo pipefail
                  mkdir a && cd a
                  for name in windows-artifacts linux-portable-artifacts linux-system-artifacts; do
                    gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "$name" -D "$name"
                  done
                  shopt -s nullglob
                  files=(windows-artifacts/*-setup.exe windows-artifacts/*.msi windows-artifacts/*.zip \
                    windows-artifacts/latest.yml windows-artifacts/*.blockmap \
                    linux-portable-artifacts/*.AppImage linux-portable-artifacts/latest-linux*.yml \
                    linux-portable-artifacts/*.blockmap linux-system-artifacts/*.deb linux-system-artifacts/*.rpm)
                  printf '%s\n' "${files[@]}"
                  gh release create "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" \
                    --verify-tag --title "NaviTV ${TAG#v}" --latest \
                    --notes "NaviTV ${TAG#v} for Windows and Linux. Google TV / Fire Stick builds are the tv-shell releases."
